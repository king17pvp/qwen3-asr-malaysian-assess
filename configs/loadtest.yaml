# Closed-loop load test: each stream sends one utterance, waits, then sends the next.
# Per-request RTF = end-to-end latency (including queueing) / audio duration.
# `full` for Baseline and the final config; `quick` for intermediate journey rows.
profiles:
  full:
    concurrency_levels: [1, 2, 4, 8, 16, 32, 64, 128]
    repeats: 3
    warmup_s: 30          # discarded
    steady_state_s: 120
    bisect: true
    bisect_max_steps: 4
    stop_after_failures: 1  # run one level past the first failure, then stop raising
  quick:
    concurrency_levels: [1, 2, 4, 8, 16, 32, 64, 128]
    repeats: 1
    warmup_s: 15
    steady_state_s: 60
    bisect: true
    bisect_max_steps: 3
    stop_after_failures: 1
  # Two-engine runs (configs/vllm/two_instances_*.yaml, dp2.yaml) can pass 128 streams.
  quick_wide:
    concurrency_levels: [1, 2, 4, 8, 16, 32, 64, 128, 192, 256]
    repeats: 1
    warmup_s: 15
    steady_state_s: 60
    bisect: true
    bisect_max_steps: 4
    stop_after_failures: 1
  full_wide:
    concurrency_levels: [1, 2, 4, 8, 16, 32, 64, 128, 192, 256]
    repeats: 3
    warmup_s: 30
    steady_state_s: 120
    bisect: true
    bisect_max_steps: 5
    stop_after_failures: 1
request_timeout_s: 60
gpu_sample_hz: 10
metrics_scrape_hz: 1      # vLLM /metrics; skipped when the server has none

audio_pool:
  manifest: data/manifests/eval.jsonl   # every eval clip; mixes the 2-5 / 5-15 / 15-30 s buckets
  seed: 1234

thresholds:
  p95_rtf_max: 0.5         # "max sustainable" level
  p95_rtf_strong: 0.3      # also reported
  max_wer_delta_points: 1.0  # WER under load within 1 point of single-stream

output_dir: results/loadtest
