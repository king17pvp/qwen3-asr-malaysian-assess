[project]
name = "asr-assess"
version = "0.1.0"
description = "Fine-tune Qwen3-ASR-1.7B on Malaysian speech and optimise it for high-concurrency inference on one GPU."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=2.1",
    "soundfile==0.14.0",
    "librosa==1.0.0",
    "jiwer==4.0.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "typer==0.27.2",
    "rich==15.0.0",
]

[project.optional-dependencies]
# Training stack: native Transformers Qwen3-ASR + PEFT LoRA.
train = [
    "torch==2.14.0",
    "transformers==5.17.0",
    "peft==0.21.0",
    "accelerate==1.15.0",
    "datasets==5.0.1",
]
# Dataset download: remote parquet row groups and single zip members from the Hub.
data = ["huggingface-hub==1.33.0", "pyarrow==25.0.1"]
# Serving stack: vLLM pins its own torch/transformers, hence the conflict with `train`.
serve = [
    "vllm[audio]==0.30.0",
    # vLLM's own torch pins, listed so uv routes them to the CUDA 12.9 index.
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "torchvision==0.28.0",
    "fastapi==0.136.3",
    "uvicorn==0.53.0",
    "httpx==0.28.1",
    "pynvml==13.0.1",
]
# Plot generation for reports only.
report = ["matplotlib==3.11.2"]

[project.scripts]
asr-assess = "asr_assess.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
    "mypy>=1.18",
    "pre-commit>=4.3",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_assess"]

# ---------------------------------------------------------------- uv
[tool.uv]
# GPU work happens on Linux only; this keeps the lock small and resolvable.
environments = ["sys_platform == 'linux'"]
# vLLM pins its own torch/transformers, so `train` and `serve` get separate resolutions.
conflicts = [[{ extra = "train" }, { extra = "serve" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "train" },
    { index = "pytorch-cu129", extra = "serve" },
]
torchaudio = [{ index = "pytorch-cu129", extra = "serve" }]
torchvision = [{ index = "pytorch-cu129", extra = "serve" }]
vllm = [{ index = "vllm-cu129", extra = "serve" }]

# cu126 runs on drivers >= CUDA 12.4 (TODO(gpu): confirm on the rented box with nvidia-smi).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# vLLM 0.30.0 is built against torch 2.13.0; its CUDA 12.x build is cu129 (needs driver >= CUDA 12.9).
[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "vllm-cu129"
url = "https://wheels.vllm.ai/0.30.0/cu129"
explicit = true

# ---------------------------------------------------------------- lint / types / tests
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "T20", "PTH", "C4", "PIE", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asr_assess.core.*", "asr_assess.benchmark.*"]
strict = true

[[tool.mypy.overrides]]
module = [
    "torch.*", "transformers.*", "peft.*", "vllm.*", "accelerate.*", "safetensors.*", "datasets.*",
    "huggingface_hub.*", "pyarrow.*", "fastapi.*", "uvicorn.*", "httpx.*", "pynvml.*",
    "librosa.*", "soundfile.*", "jiwer.*", "matplotlib.*", "starlette.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -m 'not model and not hf'"
markers = [
    "model: loads the real Qwen3-ASR checkpoint (needs the train extra; slow)",
    "hf: needs the train extra and Hub access for processor files; CPU is fine, no 1.7B weights",
]
